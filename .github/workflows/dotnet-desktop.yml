
name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IS202Oppgave1.slnx

      - name: Build solution
        run: dotnet build IS202Oppgave1.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test CrisisSystem.Tests/CrisisSystem.Tests.csproj --configuration Release --no-restore --verbosity normal
